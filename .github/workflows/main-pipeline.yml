name: Main CI Pipeline

on:
  push:
    branches: [main]
    paths:
      - "SinkingFound/**"
      - "SinkingFoundTests/**"
      - "SinkingFoundUITests/**"
      - "SinkingFound.xcodeproj/**"
      - "CHANGELOG.md"
      - ".swiftlint.yml"
      - ".github/workflows/main-pipeline.yml"
  pull_request:
    branches: [main]
    paths:
      - "SinkingFound/**"
      - "SinkingFoundTests/**"
      - "SinkingFoundUITests/**"
      - "SinkingFound.xcodeproj/**"
      - "CHANGELOG.md"
      - ".swiftlint.yml"
      - ".github/workflows/main-pipeline.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer

jobs:
  version-and-changelog:
    name: Version and changelog
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.project-version.outputs.version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Validate project version
        id: project-version
        shell: bash
        run: |
          versions="$(
            sed -nE 's/^[[:space:]]*MARKETING_VERSION = ([^;]+);/\1/p' \
              SinkingFound.xcodeproj/project.pbxproj | sort -u
          )"
          version_count="$(printf '%s\n' "$versions" | sed '/^$/d' | wc -l | tr -d ' ')"

          if [[ "$version_count" -eq 0 ]]; then
            echo "::error::No MARKETING_VERSION was found in the Xcode project."
            exit 1
          fi

          if [[ "$version_count" -ne 1 ]]; then
            echo "::error::Xcode targets contain inconsistent MARKETING_VERSION values: $versions"
            exit 1
          fi

          version="$versions"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::MARKETING_VERSION '$version' must use MAJOR.MINOR.PATCH format."
            exit 1
          fi

          version_pattern="${version//./\\.}"
          if ! grep -Eq "^## \\[$version_pattern\\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md; then
            echo "::error::CHANGELOG.md needs a dated '## [$version] - YYYY-MM-DD' section."
            exit 1
          fi

          echo "Validated Xcode project and changelog version: $version"
          echo "### Version $version validated" >> "$GITHUB_STEP_SUMMARY"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build-and-test:
    name: Build and unit tests
    needs: version-and-changelog
    runs-on: macos-15-intel
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Verify toolchain
        run: |
          xcodebuild -version
          swiftlint version

      - name: Build, lint, and run unit tests
        run: |
          xcodebuild test \
            -project SinkingFound.xcodeproj \
            -scheme SinkingFound \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=18.5' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -resultBundlePath "$RUNNER_TEMP/SinkingFoundTests.xcresult" \
            -only-testing:SinkingFoundTests \
            -quiet \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-ci-diagnostics-${{ github.run_id }}
          path: ${{ runner.temp }}/SinkingFoundTests.xcresult
          if-no-files-found: ignore
          retention-days: 7

  create-tag:
    name: Create version tag
    needs: [version-and-changelog, build-and-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Check out validated commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Create and push tag
        env:
          VERSION: ${{ needs.version-and-changelog.outputs.version }}
        shell: bash
        run: |
          tag_name="v$VERSION"

          if git ls-remote --exit-code --tags origin "refs/tags/$tag_name" > /dev/null 2>&1; then
            echo "Tag $tag_name already exists; nothing to create."
            echo "### Tag $tag_name already exists" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag_name" "$GITHUB_SHA" -m "Release $tag_name"
          git push origin "$tag_name"

          echo "Created tag $tag_name for $GITHUB_SHA"
          echo "### Created tag $tag_name" >> "$GITHUB_STEP_SUMMARY"
