name: Main Merge Pipeline

on:
  push:
    branches: [main]
    paths:
      - "Overhead/**"
      - "OverheadTests/**"
      - "OverheadUITests/**"
      - "Overhead.xcodeproj/**"
      - "CHANGELOG.md"
      - ".swiftlint.yml"
      - ".github/workflows/pull-request.yml"
      - ".github/workflows/main-pipeline.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version-and-changelog:
    name: Version and changelog
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.project-version.outputs.version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Validate project version
        id: project-version
        shell: bash
        run: |
          versions="$(
            sed -nE 's/^[[:space:]]*MARKETING_VERSION = ([^;]+);/\1/p' \
              Overhead.xcodeproj/project.pbxproj | sort -u
          )"
          version_count="$(printf '%s\n' "$versions" | sed '/^$/d' | wc -l | tr -d ' ')"

          if [[ "$version_count" -eq 0 ]]; then
            echo "::error::No MARKETING_VERSION was found in the Xcode project."
            exit 1
          fi

          if [[ "$version_count" -ne 1 ]]; then
            echo "::error::Xcode targets contain inconsistent MARKETING_VERSION values: $versions"
            exit 1
          fi

          version="$versions"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::MARKETING_VERSION '$version' must use MAJOR.MINOR.PATCH format."
            exit 1
          fi

          version_pattern="${version//./\\.}"
          if ! grep -Eq "^## \\[$version_pattern\\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md; then
            echo "::error::CHANGELOG.md needs a dated '## [$version] - YYYY-MM-DD' section."
            exit 1
          fi

          echo "Validated Xcode project and changelog version: $version"
          echo "### Version $version validated" >> "$GITHUB_STEP_SUMMARY"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build-and-test:
    name: Build and unit tests
    needs: version-and-changelog
    runs-on: macos-26
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install SwiftLint
        env:
          SWIFTLINT_VERSION: "0.63.2"
        run: |
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/swiftlint.zip" \
            "https://github.com/realm/SwiftLint/releases/download/$SWIFTLINT_VERSION/portable_swiftlint.zip"
          unzip -q -o "$RUNNER_TEMP/swiftlint.zip" -d "$RUNNER_TEMP/swiftlint"
          sudo install -m 0755 "$RUNNER_TEMP/swiftlint/swiftlint" /usr/local/bin/swiftlint

      - name: Verify toolchain
        run: |
          xcodebuild -version
          swiftlint version

      - name: Select iOS simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail

          read_runtime() {
            xcrun simctl list runtimes --json | jq -r '
              [.runtimes[] | select(.isAvailable and (.identifier | contains("SimRuntime.iOS")))]
              | sort_by(.version | split(".") | map(tonumber))
              | last // empty
              | "\(.identifier)\t\(.version)"'
          }

          runtime_line="$(read_runtime)"

          if [[ -z "$runtime_line" ]]; then
            echo "This runner image ships no iOS simulator runtime; downloading one."
            xcodebuild -downloadPlatform iOS
            runtime_line="$(read_runtime)"
          fi

          if [[ -z "$runtime_line" ]]; then
            echo "::error::No iOS simulator runtime is available on this runner."
            exit 1
          fi

          runtime="${runtime_line%%$'\t'*}"
          runtime_version="${runtime_line##*$'\t'}"

          udid="$(
            xcrun simctl list devices available --json \
              | jq -r --arg runtime "$runtime" '
                  .devices[$runtime] // []
                  | map(select(.isAvailable and (.name | startswith("iPhone"))))
                  | first // empty
                  | .udid'
          )"

          if [[ -z "$udid" ]]; then
            echo "No iPhone simulator exists for iOS $runtime_version; creating one."
            device_types="$(
              xcrun simctl list devicetypes --json \
                | jq -r --arg v "$runtime_version" '
                    def packed:
                      split(".") | map(tonumber)
                      | (.[0] * 65536) + ((.[1] // 0) * 256) + (.[2] // 0);
                    ($v | packed) as $target
                    | [ .devicetypes[]
                        | select(.productFamily == "iPhone")
                        | select((.minRuntimeVersion // 0) <= $target)
                        | select((.maxRuntimeVersion // 4294967295) >= $target) ]
                    | .[].identifier'
            )"

            for device_type in $device_types; do
              if udid="$(xcrun simctl create overhead-ci "$device_type" "$runtime" 2>/dev/null)"; then
                echo "Created $device_type on iOS $runtime_version."
                break
              fi
              udid=""
            done
          fi

          if [[ -z "$udid" ]]; then
            echo "::error::Could not find or create an iPhone simulator for iOS $runtime_version."
            exit 1
          fi

          echo "Testing on simulator $udid (iOS $runtime_version)."
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Build, lint, and run unit tests
        run: |
          xcodebuild test \
            -project Overhead.xcodeproj \
            -scheme Overhead \
            -configuration Debug \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -resultBundlePath "$RUNNER_TEMP/OverheadTests.xcresult" \
            -only-testing:OverheadTests \
            -quiet \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-ci-diagnostics-${{ github.run_id }}
          path: ${{ runner.temp }}/OverheadTests.xcresult
          if-no-files-found: ignore
          retention-days: 7

  create-tag:
    name: Create version tag
    needs: [version-and-changelog, build-and-test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Check out validated commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Create and push tag
        env:
          VERSION: ${{ needs.version-and-changelog.outputs.version }}
        shell: bash
        run: |
          tag_name="v$VERSION"

          if git ls-remote --exit-code --tags origin "refs/tags/$tag_name" > /dev/null 2>&1; then
            echo "Tag $tag_name already exists; nothing to create."
            echo "### Tag $tag_name already exists" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag_name" "$GITHUB_SHA" -m "Release $tag_name"
          git push origin "$tag_name"

          echo "Created tag $tag_name for $GITHUB_SHA"
          echo "### Created tag $tag_name" >> "$GITHUB_STEP_SUMMARY"
